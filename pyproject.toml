[project]
name = "teamknowledge"
version = "0.1.0"
description = "Structured, reviewed team findings for Claude Code, GitLab and Neo4j"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "neo4j>=5.27",
  "mcp>=1.10,<2",
  "jinja2>=3.1",
  "markupsafe>=2.1",
  "markdown>=3.7",
  "requests>=2.32",
  "python-ulid>=3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.55"]
bedrock = ["boto3>=1.35"]
eval = ["testcontainers[neo4j]>=4.8"]

[project.scripts]
tk = "teamknowledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamknowledge"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[neo4j]>=4.8",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "neo4j: needs a Neo4j container via Docker",
  "live: needs real external credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pins the rule families that actually produce findings here under ruff's current default
# selection. Full "E" and "B" families are deliberately omitted: selecting them wholesale
# pulls in E501 (line-too-long, ~336 hits) and B905 (zip-without-strict), neither of which
# fires under the implicit default and neither of which this fix wave addresses; RUF is
# pinned to the two specific codes that fire (RUF005 is new noise under the full family).
select = ["F", "I", "UP", "C4", "BLE", "PLW", "FURB", "RUF012", "RUF059"]
